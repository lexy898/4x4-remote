name: Bug report
description: Something in 4x4 Remote does not work as it should
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, please do not use this form: see
        [SECURITY.md](https://github.com/lexy898/4x4-remote/blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did 4x4 do, or fail to do?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before it happened, step by step?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 4x4 version
      description: The output of `4x4 --version`.
      placeholder: 4x4 Remote 1.0.0
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package version
      description: >-
        If you installed the package `4x4-remote-git`, the output of `pacman -Q 4x4-remote-git`. It
        includes the commit, which `4x4 --version` does not: every build after a release prints the
        same version.
      placeholder: 4x4-remote-git 1.0.0.r12.g1a2b3c4-1
    validations:
      required: false
  - type: input
    id: transmission
    attributes:
      label: Transmission version
      description: >-
        The version of the daemon. In 4x4, the Test button of the Connection dialog (the gear in
        the toolbar) shows it.
      placeholder: Transmission 4.1.3
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Distribution and desktop
      description: For example Arch Linux with KDE Plasma 6.
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Wayland or X11
      description: The kind of session 4x4 runs in. `echo $XDG_SESSION_TYPE` tells it.
      options:
        - Wayland
        - X11
        - I do not know
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant lines of the log
      description: >-
        4x4 keeps one log file per day in `~/.local/state/4x4/`, named `4x4.<date>.log`. Paste the
        lines around the problem. Before you do, remove addresses, names and passwords: the log
        names the server (host and port) and paths that hold your user name.
      render: text
