[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lexy898/4x4"
publish = false

[workspace.dependencies]
x4-rpc = { path = "crates/x4-rpc" }
x4-core = { path = "crates/x4-core" }
anyhow = "1.0.104"
# The desktop's file dialog through the xdg-desktop-portal, with a filter for .torrent files and a
# title of our own (Linux only), parented to the window it opens over (`raw_handle`: the X11 window
# id, or a Wayland surface exported through xdg-foreign, hence `wayland`). gpui already pulls in
# this version and every crate these features need; ours adds no crate.
ashpd = { version = "0.13.13", default-features = false, features = [
  "async-io",
  "file_chooser",
  "raw_handle",
  "wayland",
] }
# The worker thread sends events to the UI, which awaits them on its executor.
async-channel = "2.5.0"
base64 = "0.23.1"
# The dates of the details panel in the local time zone. gpui already pulls it in, with the clock.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# The UI sends commands to the worker thread, which waits on them until its next wakeup.
crossbeam-channel = "0.5.17"
# Where the config, the UI state and the logs live (XDG directories on Linux).
directories = "6.0.0"
# Parses the .ftl files in the localization parity test (dev-dependency only).
fluent-syntax = "0.12.0"
gpui-kit = "=0.8.1"
# Fluent messages for every user-visible string; `fl!` checks ids and arguments at compile time.
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = "0.10.1"
# `O_NONBLOCK` for opening a .torrent file, so that a FIFO swapped in after the first look never
# blocks the open. gpui already pulls it in.
libc = "0.2.191"
# The user name and password pasted inside an address are percent-decoded (x4-core). `url` already
# pulls it in with the same features, so it adds no crate.
percent-encoding = { version = "2.3.2", default-features = false, features = [
  "std",
] }
# The window and display handles that parent the file dialog (Linux only). gpui already pulls in
# this version.
raw-window-handle = "0.6.2"
# Embeds the .ftl files into the binary (read from disk in debug builds).
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-1: the info hash of a .torrent file (x4-core), and the piece hashes of the metainfo the
# live tests create.
sha1 = "0.11.0"
# The UI state is written to a temporary file first and renamed over the old one.
tempfile = "3.27.0"
thiserror = "2.0.21"
# The persisted UI state and the owner's config file; both are TOML.
toml = "1.1.8"
tracing = "0.1.44"
# The daily log file, written on a thread of its own so that logging never waits on the disk.
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Plain HTTP only: the daemon is reached over http:// on the local network, so no TLS stack.
ureq = { version = "3.5.0", default-features = false }
# file:// launch arguments become local paths (x4-core). gpui already pulls it in; `std` is the
# feature `Url::to_file_path` needs.
url = { version = "2.5.8", default-features = false, features = ["std"] }

[workspace.lints.rust]
# `deny`, not `forbid`: a `forbid` cannot be overridden, not even by `#[expect]`. The one exception,
# approved by the owner, is the `mallopt` call in crates/x4-app/src/allocator.rs; `just lint-policy`
# rejects an `unsafe_code` exception anywhere else.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
indexing_slicing = "warn"
let_underscore_must_use = "warn"
mod_module_files = "warn"
# One operation per unsafe block, so a block cannot hide a second unsafe call. It counts per block;
# `just lint-policy` also requires a single `unsafe` keyword in the allocator.
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"

# A vendored copy of the gpui-pre-wgpu that gpui-kit pulls in, patched so the GPU context is
# created Vulkan-first and the OpenGL driver stays unloaded (vendor/gpui-pre-wgpu/PATCHED.md).
# The directory is not a workspace member, so our lints do not apply to it.
[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }

# Line tables only (enough for backtraces) for our crates and no debug info for dependencies
# keep links fast (the agent Stop hook builds often) and the CI cache small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
