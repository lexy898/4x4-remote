[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lexy898/4x4"
publish = false

[workspace.dependencies]
x4-rpc = { path = "crates/x4-rpc" }
x4-core = { path = "crates/x4-core" }
anyhow = "1.0.104"
base64 = "0.23.1"
gpui-kit = "=0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-1 for the metainfo the live tests create (dev-dependency only).
sha1 = "0.11.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Plain HTTP only: the daemon is reached over http:// on the local network, so no TLS stack.
ureq = { version = "3.5.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
indexing_slicing = "warn"
let_underscore_must_use = "warn"
mod_module_files = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"

# Line tables only (enough for backtraces) for our crates and no debug info for dependencies
# keep links fast (the agent Stop hook builds often) and the CI cache small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
