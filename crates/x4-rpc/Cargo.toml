[package]
name = "x4-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test doubles (`testing` module) for this crate's and dependent crates' tests.
test-support = []

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true

[dev-dependencies]
sha1.workspace = true
# Self dev-dependency: the integration tests in tests/ use the `testing` module, and
# `just test` (plain `cargo nextest run --workspace`) must build them without extra flags.
x4-rpc = { workspace = true, features = ["test-support"] }

[[example]]
name = "record_fixtures"
required-features = ["test-support"]

[lints]
workspace = true
