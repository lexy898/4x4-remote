[package]
name = "x4-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "4x4"
path = "src/main.rs"

# The main window over a synthetic daemon of 2000 torrents (`just demo-synthetic`). `test`: its
# unit tests (the synthetic daemon, the frame statistics) run with `just test`.
[[example]]
name = "synthetic"
test = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
crossbeam-channel.workspace = true
directories.workspace = true
gpui-kit.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
rust-embed.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
x4-core.workspace = true
x4-rpc.workspace = true

[dev-dependencies]
fluent-syntax.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
# The synthetic daemon of the `synthetic` example reads the requests and writes the answers.
serde_json.workspace = true
# `x4_core::test_support::torrent` builds the torrents of the snapshots the window tests send.
x4-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
