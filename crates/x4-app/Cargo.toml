[package]
name = "x4-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `cargo run -p x4-app` runs the app, also when the `synthetic` feature adds the demo's binary.
default-run = "4x4"

[[bin]]
name = "4x4"
path = "src/main.rs"

# The main window over a synthetic daemon of 2000 torrents (`just demo-synthetic`). A binary rather
# than an example: Cargo builds examples with the dev-dependencies' features, which would put
# gpui-kit's test support into what is measured.
[[bin]]
name = "x4-synthetic"
path = "src/bin/x4-synthetic/main.rs"
required-features = ["synthetic"]

[features]
# The `x4-synthetic` demo and what only it needs. Off by default, so `4x4` is built without it.
synthetic = ["dep:base64", "dep:serde_json"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
# The synthetic daemon of the `x4-synthetic` demo writes the `pieces` bitfield as base64.
base64 = { workspace = true, optional = true }
chrono.workspace = true
crossbeam-channel.workspace = true
directories.workspace = true
gpui-kit.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
rust-embed.workspace = true
# The synthetic daemon of the `x4-synthetic` demo reads the requests and writes the answers.
serde_json = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
x4-core.workspace = true
x4-rpc.workspace = true

[target.'cfg(unix)'.dependencies]
# `O_NONBLOCK` for opening a .torrent file (the `adding` module).
libc.workspace = true

[dev-dependencies]
fluent-syntax.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
# `x4_core::test_support::torrent` builds the torrents of the snapshots the window tests send.
x4-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
