[graph]
# The platforms 4x4 is built for; dependencies only used elsewhere are not checked.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" advisories fail only for direct dependencies of
# our crates: the pinned GUI stack pulls in unmaintained crates we cannot replace.
unmaintained = "workspace"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# The crates.io `gpui` crate (0.2.x) is an older, unrelated GPUI; the app uses gpui-kit.
[[bans.deny]]
crate = "gpui"
reason = "use gpui-kit, not the crates.io gpui crate"

# Only the app crate talks to the UI toolkit (AGENTS.md, Architecture).
[[bans.deny]]
crate = "gpui-kit"
wrappers = ["x4-app"]
reason = "only x4-app may depend on the UI toolkit"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
